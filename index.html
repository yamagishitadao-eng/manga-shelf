<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まんが本棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* VOICE: 自分の本棚を眺める楽しさ、でも道具としてキビキビ
   IDEA: 書店の棚と単行本の背表紙。所持巻は背表紙の列で見える
   PICTURE: 各作品の「背表紙の棚」— 持ってる巻・抜け・未購入の新刊が一目で
   COLOUR and TYPE: 紙の白・墨の黒・朱の差し色。スクリーントーンの網点。Dela Gothic One + Zen Kaku Gothic New
   LAYOUT: 上に集計、固定ツールバー、五十音インデックス、行ごとの棚 */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaf7,#141312);--card:light-dark(#fff,#1d1c1a);--ink:light-dark(#151412,#f1eee8);
--mute:light-dark(#6b665e,#a39d93);--line:light-dark(#e6e2da,#33302c);--red:light-dark(#d7261e,#ff5a4f);
--own:light-dark(#151412,#f1eee8);--gap:light-dark(#f2c94c,#e0b33a);--soft:light-dark(#efece6,#2a2825)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{padding:28px max(5vw,16px) 18px;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0 0 0 55%;background:radial-gradient(circle,currentColor 1.4px,transparent 1.6px) 0 0/9px 9px;opacity:.18;mask:linear-gradient(90deg,transparent,#000)}
.hwrap{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between;position:relative;z-index:1}
h1{font:400 clamp(32px,7vw,48px)/1.05 "Dela Gothic One",sans-serif;margin:0;letter-spacing:.02em}
h1 span{color:var(--red)}
.stats{display:flex;gap:24px}
.stat b{display:block;font:400 clamp(24px,5vw,32px)/1.1 "Dela Gothic One",sans-serif}
.stat small{font-size:13px;opacity:.75}
.stat.alert b{color:var(--red)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px max(5vw,16px)}
.bwrap{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:8px}
.bwrap input[type=search]{flex:1 1 200px}
input,select,textarea{font-size:16px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
select{flex:0 1 auto}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);font-weight:700;white-space:nowrap}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--line)}
.idx{max-width:1100px;margin:8px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.idx button{flex:none;min-width:40px;min-height:36px;border:0;border-radius:8px;background:var(--soft);font-weight:700}
.idx button:disabled{opacity:.3;cursor:default}
main{max-width:1100px;margin:auto;padding:12px max(5vw,16px) 80px}
.sec h2{font:400 22px/1 "Dela Gothic One",sans-serif;margin:28px 0 10px;display:flex;align-items:center;gap:10px;scroll-margin-top:130px}
.sec h2::after{content:"";flex:1;height:2px;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.cover{flex:none;width:84px;position:relative;background:hsl(var(--h) 50% 42%);background-image:radial-gradient(circle,rgba(255,255,255,.28) 1px,transparent 1.3px);background-size:5px 5px;display:flex;align-items:center;justify-content:center;padding:8px 6px;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover span{writing-mode:vertical-rl;color:#fff;font:400 16px/1.15 "Dela Gothic One",sans-serif;max-height:150px;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.buys{display:grid;gap:3px}
.buy{display:flex;align-items:center;gap:8px;font-size:14px}
.buy i{flex:none;width:12px;height:12px;border-radius:3px}
.buy b{min-width:5.5em;white-space:nowrap}
.buy .arw{color:var(--mute);font-size:12px}
.cvf{display:flex;gap:10px;align-items:center}
.cvf .cover{width:64px;height:90px;border-radius:6px}
.cvf .cover span{font-size:12px}
.pr select{padding:8px}
.cands{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}
.cands:empty{display:none}
.cands button{flex:none;width:60px;height:86px;padding:0;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.cands button.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.cands img{width:100%;height:100%;object-fit:cover;display:block}
.cb{flex:1;padding:12px 12px 12px 14px;display:grid;gap:6px}
.top{display:flex;gap:8px;align-items:start}
.top h3{flex:1;margin:0;font-size:17px;line-height:1.3}
.top h3 small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.plus{flex:none;min-height:36px;min-width:52px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card);font-weight:700;font-size:14px}
.stars{color:var(--red);letter-spacing:1px;font-size:14px}.stars i{color:var(--line);font-style:normal}
.meta{font-size:13px;color:var(--mute)}
.shelf{display:flex;flex-wrap:wrap;gap:2px;padding:6px 0 4px;border-bottom:3px solid var(--ink)}
.shelf span{width:7px;height:26px;border-radius:2px 2px 0 0;background:var(--own)}
.shelf span.g{background:transparent;border:2px solid var(--red);border-bottom:0}
.shelf span.n{background:transparent;border:1.5px dashed var(--mute);border-bottom:0}
.shelf.big{display:block;position:relative;height:14px;padding:0;border:0;background:var(--soft);border-radius:7px;overflow:hidden}
.shelf.big i{position:absolute;top:0;height:100%}
.line{font-size:14px}.line b{font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:4px;white-space:nowrap}
.tag.new{background:var(--red);color:#fff}.tag.gap{background:var(--gap);color:#151412}.tag.done{background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);white-space:nowrap}
.empty{text-align:center;padding:60px 16px;color:var(--mute)}
.empty b{display:block;font:400 22px "Dela Gothic One",sans-serif;color:var(--ink);margin-bottom:8px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:end;justify-content:center}
.ov.on{display:flex}
.panel{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px 24px}
@media(min-width:640px){.ov{align-items:center}.panel{border-radius:18px}}
.panel h2{font:400 22px "Dela Gothic One",sans-serif;margin:0 0 14px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label,.lbl{font-size:13px;font-weight:700;color:var(--mute)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rate{display:flex;gap:2px}
.rate button{width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--line)}
.rate button.on{color:var(--red)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 64px 16px 64px 44px;gap:6px;align-items:center;margin-bottom:6px}
.pr input{padding:8px}.pr span{text-align:center;color:var(--mute)}
.x{min-height:44px;border:0;background:var(--soft);border-radius:10px;font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .sp{flex:1}
.hint{font-size:13px;color:var(--mute);margin:4px 0 0}
textarea{width:100%;min-height:160px;font-family:ui-monospace,monospace;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;transition:transform .25s;max-width:92vw}
.toast.on{transform:translate(-50%,0)}
.toast button{background:none;border:0;color:var(--red);font-weight:700;min-height:36px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){.stats{gap:16px}.pr{grid-template-columns:minmax(0,1fr) 54px 12px 54px 44px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>まんが<span>本棚</span></h1>
  <div class="stats" id="stats"></div>
</div></header>

<div class="bar">
  <div class="bwrap">
    <input type="search" id="q" placeholder="タイトル・作者・アプリで検索" aria-label="検索">
    <select id="fApp" aria-label="アプリで絞り込み"></select>
    <select id="fFlag" aria-label="状態で絞り込み">
      <option value="">すべて</option><option value="new">新刊未購入</option><option value="gap">抜けあり</option><option value="ongoing">連載中</option><option value="done">完結</option>
    </select>
    <select id="sort" aria-label="並び順">
      <option value="kana">あいうえお順</option><option value="rate">評価が高い順</option><option value="upd">更新が新しい順</option>
    </select>
    <button class="btn pri" id="add">＋ 追加</button>
    <button class="btn ghost" id="bk">バックアップ</button>
  </div>
  <div class="idx" id="idx"></div>
</div>

<main id="list"></main>

<div class="ov" id="ov"><form class="panel" id="form" autocomplete="off">
  <h2 id="fT">作品を追加</h2>
  <div class="f"><label for="iTitle">タイトル</label><input id="iTitle" required></div>
  <div class="f"><label for="iYomi">よみがな（あいうえお順に使います）</label><input id="iYomi" placeholder="ひらがな・カタカナで"></div>
  <div class="f"><span class="lbl">表紙</span>
    <div class="cvf"><div class="cover" id="cvPrev"></div>
      <div style="display:grid;gap:6px">
        <button type="button" class="btn" id="cvFind">1巻の表紙を自動で探す</button>
        <button type="button" class="btn ghost" id="cvDel">表紙を外す</button>
      </div></div>
    <div class="cands" id="cvCands"></div>
    <p class="hint" id="cvHint">新しく追加するときは、タイトルを入れると自動で探します。違う表紙なら候補から選び直してください。</p>
  </div>
  <div class="row2">
    <div class="f"><label for="iAuthor">作者</label><input id="iAuthor"></div>
    <div class="f"><label for="iStatus">状態</label><select id="iStatus"><option>連載中</option><option>完結</option></select></div>
  </div>
  <div class="row2">
    <div class="f"><span class="lbl">評価</span><div class="rate" id="iRate"></div></div>
    <div class="f"><label for="iLatest">既刊（最新巻）</label><input id="iLatest" type="number" min="0" inputmode="numeric" placeholder="例: 14"></div>
  </div>
  <div class="f"><span class="lbl">購入記録（アプリごと・巻の範囲）</span>
    <div id="iPur"></div>
    <button type="button" class="btn ghost" id="addPur">＋ 購入記録を追加</button>
    <p class="hint">例: Kindle 1〜5巻、ジャンプ+ 6〜12巻。1冊だけなら同じ数字を入れます。</p>
  </div>
  <div class="f"><label for="iMemo">メモ</label><input id="iMemo" placeholder="次は紙で買う、など"></div>
  <div class="acts">
    <button type="button" class="btn ghost" id="del">削除</button><span class="sp"></span>
    <button type="button" class="btn ghost" id="cancel">閉じる</button>
    <button type="submit" class="btn pri">保存</button>
  </div>
</form></div>

<div class="ov" id="ovB"><div class="panel">
  <h2>バックアップ</h2>
  <p class="hint">データはこのブラウザに保存されます。機種変更や別の端末で使うときは、ここで書き出して読み込んでください。</p>
  <textarea id="bTxt" aria-label="データ"></textarea>
  <div class="acts"><button class="btn" id="bAuto">表紙のない作品の表紙をまとめて取得</button></div>
  <div class="acts">
    <button class="btn ghost" id="bCopy">コピー</button>
    <button class="btn ghost" id="bDl">ファイルに保存</button>
    <label class="btn ghost" style="display:inline-flex;align-items:center">ファイルを開く<input type="file" id="bFile" accept=".json,application/json" hidden></label>
    <span class="sp"></span>
    <button class="btn ghost" id="bClose">閉じる</button>
    <button class="btn pri" id="bLoad">貼り付けた内容で上書き</button>
  </div>
</div></div>

<datalist id="apps"></datalist>
<div class="toast" id="toast"><span id="tMsg"></span><button id="tUndo">元に戻す</button></div>

<script>
{
const K='manga-shelf-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APPS=['ピッコマ','Kindle','ブックウォーカー','DMMブックス','DLsite','アメーバマンガ','ジャンプ+','マガポケ','LINEマンガ','コミックシーモア','ebookjapan','BookLive!','楽天Kobo','紙の本'];
const COLS=[[/ピッコマ|piccoma/i,'#f0a500'],[/kindle|キンドル/i,'#2f6fd6'],[/walker|ウォーカー/i,'#00a0e9'],[/dmm/i,'#5b5b66'],[/dlsite/i,'#1d3d8f'],[/ameba|アメーバ/i,'#8bc34a'],
 [/ジャンプ|jump/i,'#e2231a'],[/マガポケ/i,'#12a39a'],[/line/i,'#06c755'],[/シーモア/i,'#e8508c'],[/ebook|イーブック/i,'#8a3ffc'],[/booklive|ブックライブ/i,'#ff7a00'],[/kobo|楽天/i,'#bf0000'],[/紙/,'#8b5a2b']];
const col=a=>{if(!a)return'#9a948a';for(const[r,c]of COLS)if(r.test(a))return c;let h=0;for(const ch of a)h=(h*37+ch.charCodeAt(0))%360;return`hsl(${h} 55% 50%)`};
const volApp=b=>{const m=new Map();for(const p of b.purchases||[])for(let v=+p.from;v<=(+p.to||+p.from)&&v<2000;v++)m.set(v,p.app||'');return m};
const runs=b=>{const m=volApp(b),r=[];for(const v of [...m.keys()].sort((x,y)=>x-y)){const a=m.get(v),l=r.at(-1);if(l&&l.app===a&&l.to===v-1)l.to=v;else r.push({app:a,from:v,to:v})}return r};
const SAMPLE=[
 {title:'星屑ベーカリー',yomi:'ほしくずべーかりー',author:'サンプル作者A',rating:5,latest:17,status:'連載中',purchases:[{app:'ピッコマ',from:1,to:10},{app:'ブックウォーカー',from:11,to:15}],memo:'これはサンプルです'},
 {title:'鋼の羅針盤',yomi:'はがねのらしんばん',author:'サンプル作者B',rating:4,latest:9,status:'完結',purchases:[{app:'DMMブックス',from:1,to:3},{app:'アメーバマンガ',from:5,to:9}],memo:''},
 {title:'あおぞら食堂',yomi:'あおぞらしょくどう',author:'サンプル作者C',rating:3,latest:6,status:'連載中',purchases:[{app:'紙の本',from:1,to:6}],memo:''}
].map((b,i)=>({...b,id:'s'+i,updated:Date.now()-i*1e6}));
let books;
try{books=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!Array.isArray(books))books=SAMPLE;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(books))}catch(e){setTimeout(()=>toast('保存できませんでした。ブラウザの容量を確認してください'),50)}};

const coll=new Intl.Collator('ja');
const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const key=b=>hira((b.yomi||b.title||'').trim()).toLowerCase();
const ROWS=[['あ','ぁあぃいぅうぇえぉおゔ'],['か','ゕかきくけこゖ'],['さ','さしすせそ'],['た','たちっつてと'],['な','なにぬねの'],['は','はひふへほ'],['ま','まみむめも'],['や','ゃやゅゆょよ'],['ら','らりるれろ'],['わ','ゎわゐゑをん']];
const GROUPS=[...ROWS.map(r=>r[0]),'英数','他'];
const gyou=k=>{const c=k.normalize('NFD')[0]||'';for(const[g,s]of ROWS)if(s.includes(c))return g;return /[a-z0-9]/.test(c)?'英数':'他'};
const owned=b=>{const s=new Set();for(const p of b.purchases||[]){const a=+p.from||0,z=+p.to||a;for(let v=Math.max(1,a);v<=z&&v<2000;v++)s.add(v)}return s};
const info=b=>{const s=owned(b),max=s.size?Math.max(...s):0,gaps=[];for(let v=1;v<max;v++)if(!s.has(v))gaps.push(v);const nw=Math.max(0,(+b.latest||0)-max);return{s,max,gaps,nw}};
const ranges=s=>{const a=[...s].sort((x,y)=>x-y),r=[];for(const v of a){const l=r[r.length-1];if(l&&v===l[1]+1)l[1]=v;else r.push([v,v])}return r.map(([x,y])=>x===y?x:x+'–'+y).join(', ')};
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const stars=n=>'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i>';
const allApps=()=>[...new Set([...books.flatMap(b=>(b.purchases||[]).map(p=>p.app).filter(Boolean)),...APPS])];

const okCover=c=>typeof c==='string'&&(/^https:\/\/(books\.google\.com|books\.googleusercontent\.com|ndlsearch\.ndl\.go\.jp)\/[^\s"'<>]*$/.test(c));
const coverHTML=b=>`<div class="cover" style="--h:${hue(b.title||'')}">${okCover(b.cover)?`<img src="${esc(b.cover)}" alt="${esc(b.title)}の表紙" referrerpolicy="no-referrer" onerror="this.remove()">`:`<span>${esc((b.title||'？').slice(0,9))}</span>`}</div>`;
function card(b){
  const{s,max,gaps,nw}=info(b),n=Math.max(max,+b.latest||0);
  const va=volApp(b),rs=runs(b);let shelf='';
  if(n<=60){let h='';for(let v=1;v<=n;v++)h+=s.has(v)?`<span style="background:${col(va.get(v))}" title="${v}巻 ${esc(va.get(v))}"></span>`:`<span class="${v<max?'g':'n'}" title="${v}巻"></span>`;shelf=`<div class="shelf" aria-hidden="true">${h||'<span class="n"></span>'}</div>`}
  else shelf=`<div class="shelf big" aria-hidden="true">${rs.map(r=>`<i style="left:${((r.from-1)/n*100).toFixed(2)}%;width:${((r.to-r.from+1)/n*100).toFixed(2)}%;background:${col(r.app)}"></i>`).join('')}</div>`;
  const chips=rs.length?`<div class="buys">${rs.map((r,i)=>`<div class="buy"><i style="background:${col(r.app)}"></i><b>${r.from===r.to?r.from:r.from+'〜'+r.to}巻</b>${esc(r.app||'アプリ未設定')}</div>`).join('')}</div>`:'';
  return `<article class="card" data-id="${esc(b.id)}" tabindex="0">
   ${coverHTML(b)}
   <div class="cb">
    <div class="top"><h3>${esc(b.title)}<small>${esc(b.author||'')}${b.author?'・':''}${esc(b.status||'')}</small></h3>
     <button class="plus" data-plus="${esc(b.id)}" aria-label="${esc(b.title)}の${max+1}巻を追加">+1巻</button></div>
    <div class="stars" aria-label="評価${b.rating||0}">${stars(b.rating||0)}</div>
    ${shelf}
    <div class="line">所持 <b>${s.size}</b>冊${s.size?`（${esc(ranges(s))}巻）`:''}${b.latest?` / 既刊${+b.latest}巻`:''}
     ${nw?`<span class="tag new">新刊${nw}冊</span>`:''}${gaps.length?`<span class="tag gap">抜け ${esc(ranges(new Set(gaps)))}巻</span>`:''}${b.status==='完結'&&!nw&&!gaps.length&&s.size?'<span class="tag done">コンプ</span>':''}</div>
    ${chips}
    ${b.memo?`<div class="meta">${esc(b.memo)}</div>`:''}
   </div></article>`;
}

function render(){
  const q=$('#q').value.trim().toLowerCase(),fa=$('#fApp').value,ff=$('#fFlag').value,so=$('#sort').value;
  const apps=allApps(),cur=fa;
  $('#fApp').innerHTML='<option value="">全アプリ</option>'+apps.filter(a=>books.some(b=>(b.purchases||[]).some(p=>p.app===a))).map(a=>`<option${a===cur?' selected':''}>${esc(a)}</option>`).join('');
  $('#apps').innerHTML=apps.map(a=>`<option value="${esc(a)}">`).join('');
  let vol=0,newT=0;for(const b of books){const i=info(b);vol+=i.s.size;if(i.nw)newT++}
  $('#stats').innerHTML=`<div class="stat"><b>${books.length}</b><small>作品</small></div><div class="stat"><b>${vol}</b><small>所持冊数</small></div><div class="stat${newT?' alert':''}"><b>${newT}</b><small>新刊未購入</small></div>`;
  let list=books.filter(b=>{
    if(q&&![b.title,b.yomi,b.author,b.memo,...(b.purchases||[]).map(p=>p.app)].join(' ').toLowerCase().includes(q))return false;
    if(fa&&!(b.purchases||[]).some(p=>p.app===fa))return false;
    const i=info(b);
    if(ff==='new'&&!i.nw)return false;if(ff==='gap'&&!i.gaps.length)return false;
    if(ff==='ongoing'&&b.status==='完結')return false;if(ff==='done'&&b.status!=='完結')return false;
    return true});
  const byKana=(a,b)=>coll.compare(key(a),key(b));
  list.sort(so==='rate'?(a,b)=>(b.rating||0)-(a.rating||0)||byKana(a,b):so==='upd'?(a,b)=>(b.updated||0)-(a.updated||0):byKana);
  const present=new Set(list.map(b=>gyou(key(b))));
  $('#idx').style.display=so==='kana'&&list.length?'flex':'none';
  $('#idx').innerHTML=GROUPS.map(g=>`<button data-g="${g}"${present.has(g)?'':' disabled'}>${g}</button>`).join('');
  if(!books.length){$('#list').innerHTML='<div class="empty"><b>本棚はまだ空です</b>「＋ 追加」から持っている漫画を登録しましょう</div>';return}
  if(!list.length){$('#list').innerHTML='<div class="empty"><b>見つかりません</b>検索語や絞り込みを変えてみてください</div>';return}
  const smp=books.some(b=>String(b.id).startsWith('s'))?'<p class="hint">サンプルデータが入っています。各カードを開いて削除できます。</p>':'';
  if(so!=='kana'){$('#list').innerHTML=smp+`<div class="sec"><div class="grid" style="margin-top:16px">${list.map(card).join('')}</div></div>`;return}
  $('#list').innerHTML=smp+GROUPS.filter(g=>present.has(g)).map(g=>`<section class="sec"><h2 id="g-${g}">${g}</h2><div class="grid">${list.filter(b=>gyou(key(b))===g).map(card).join('')}</div></section>`).join('');
}

// toast + undo
let snap=null,tt;
function toast(msg,undo){snap=undo?JSON.stringify(books):null;$('#tMsg').textContent=msg;$('#tUndo').style.display=undo?'':'none';$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),5000)}
$('#tUndo').onclick=()=>{if(snap){books=JSON.parse(snap);snap=null;save();render()}$('#toast').classList.remove('on')};
const before=()=>JSON.stringify(books);
function commit(prev,msg){save();render();snap=prev;$('#tMsg').textContent=msg;$('#tUndo').style.display='';$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),5000)}

// +1巻
function plusOne(id){
  const b=books.find(x=>x.id===id);if(!b)return;const prev=before();
  const{max}=info(b),next=max+1;b.purchases=b.purchases||[];
  const p=b.purchases.find(p=>+p.to===max&&max>0);
  if(p)p.to=next;else b.purchases.push({app:b.purchases.at(-1)?.app||'',from:next,to:next});
  if((+b.latest||0)<next)b.latest=next;b.updated=Date.now();
  commit(prev,`${b.title} ${next}巻を追加`);
}

// editor
let editing=null,tmp=[],rate=0,delArmed=false;
function drawRate(){$('#iRate').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-r="${n}" class="${n<=rate?'on':''}" aria-label="${n}点">★</button>`).join('')}
function appField(p){
  const list=allApps();
  if(p._c||(p.app&&!list.includes(p.app)))return `<input list="apps" data-k="app" value="${esc(p.app)}" placeholder="アプリ名を入力" aria-label="アプリ">`;
  return `<select data-k="app" aria-label="アプリ" style="border-left:6px solid ${col(p.app)}"><option value="">アプリを選ぶ</option>${list.map(a=>`<option${a===p.app?' selected':''}>${esc(a)}</option>`).join('')}<option value="__c">その他（入力）</option></select>`;
}
function drawPur(){$('#iPur').innerHTML=tmp.map((p,i)=>`<div class="pr" data-i="${i}">
  ${appField(p)}
  <input type="number" min="1" inputmode="numeric" data-k="from" value="${esc(p.from)}" aria-label="何巻から"><span>〜</span>
  <input type="number" min="1" inputmode="numeric" data-k="to" value="${esc(p.to)}" aria-label="何巻まで">
  <button type="button" class="x" data-x="${i}" aria-label="この記録を削除">×</button></div>`).join('')}
function openEd(id){
  editing=id?books.find(b=>b.id===id):null;const b=editing||{};
  $('#fT').textContent=editing?'作品を編集':'作品を追加';
  $('#iTitle').value=b.title||'';$('#iYomi').value=b.yomi||'';$('#iAuthor').value=b.author||'';
  $('#iStatus').value=b.status||'連載中';$('#iLatest').value=b.latest||'';$('#iMemo').value=b.memo||'';
  rate=b.rating||0;tmp=(b.purchases||[]).map(p=>({...p}));if(!tmp.length)tmp=[{app:'',from:1,to:''}];
  cover=okCover(b.cover)?b.cover:'';drawCover();drawCands([]);seq++;
  $('#cvHint').textContent=blocked()?NOTE:'新しく追加するときは、タイトルを入れると自動で探します。';
  delArmed=false;$('#del').textContent='削除';$('#del').style.display=editing?'':'none';
  drawRate();drawPur();$('#ov').classList.add('on');setTimeout(()=>$('#iTitle').focus(),50);
}
const closeEd=()=>$('#ov').classList.remove('on');
$('#iRate').onclick=e=>{const r=+e.target.dataset.r;if(r){rate=rate===r?0:r;drawRate()}};
$('#iPur').oninput=e=>{const i=+e.target.closest('.pr').dataset.i,k=e.target.dataset.k;
  if(k==='app'&&e.target.tagName==='SELECT'){if(e.target.value==='__c'){tmp[i].app='';tmp[i]._c=1;drawPur();$(`#iPur [data-i="${i}"] input`).focus()}else{tmp[i].app=e.target.value;e.target.style.borderLeftColor=col(e.target.value)}return}
  tmp[i][k]=k==='app'?e.target.value:e.target.value===''?'':+e.target.value};
let cover='';
const drawCover=()=>{$('#cvPrev').outerHTML=coverHTML({title:$('#iTitle').value,cover}).replace('class="cover"','class="cover" id="cvPrev"')};
// 表紙の自動取得（Googleブックス → 見つからなければ国立国会図書館の書影）。保存するのは画像のリンクだけ
const VOL1=/(^|[^0-9０-９])[1１]([^0-9０-９]|$)|第一巻|上巻/;
async function findCovers(title){
  const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&langRestrict=ja&q='+encodeURIComponent('intitle:'+title));
  if(!r.ok)throw new Error('http');
  const j=await r.json(),out=[],seen=new Set();
  for(const it of j.items||[]){
    const v=it.volumeInfo||{},name=(v.title||'')+' '+(v.subtitle||'');
    let url=v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||'';
    if(url)url=url.replace(/^http:/,'https:').replace('&edge=curl','');
    else{const isbn=(v.industryIdentifiers||[]).find(x=>x.type==='ISBN_13');if(isbn)url=`https://ndlsearch.ndl.go.jp/thumbnail/${isbn.identifier}.jpg`}
    if(!url||!okCover(url)||seen.has(url))continue;seen.add(url);
    out.push({url,name,score:(VOL1.test(name)?2:0)+(hira(name).includes(hira(title))?1:0)});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,8);
}
const blocked=()=>{try{return window.self!==window.top}catch(e){return true}};
const NOTE='表紙の自動取得はGitHub Pagesで開いたときに使えます';
function drawCands(list){$('#cvCands').innerHTML=list.map(c=>`<button type="button" data-u="${esc(c.url)}" class="${c.url===cover?'on':''}" title="${esc(c.name)}"><img src="${esc(c.url)}" alt="${esc(c.name)}" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></button>`).join('')}
let seq=0;
async function searchCover(auto){
  const t=$('#iTitle').value.trim();if(!t)return;
  if(blocked()){$('#cvHint').textContent=NOTE;return}
  const my=++seq;$('#cvHint').textContent='表紙を探しています…';
  try{const list=await findCovers(t);if(my!==seq)return;
    if(!list.length){$('#cvHint').textContent='見つかりませんでした。タイトルを正式名にすると見つかることがあります';drawCands([]);return}
    if(auto||!cover){cover=list[0].url;drawCover()}
    drawCands(list);$('#cvHint').textContent='違う表紙なら候補から選んでください';
  }catch(e){if(my===seq)$('#cvHint').textContent='表紙を取得できませんでした。時間をおいて試してください'}
}
$('#cvFind').onclick=()=>searchCover(false);
$('#cvCands').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;cover=b.dataset.u;drawCover();for(const x of $('#cvCands').children)x.classList.toggle('on',x===b)};
$('#iTitle').addEventListener('change',()=>{if(!editing&&!cover)searchCover(true)});
$('#cvDel').onclick=()=>{cover='';drawCover();drawCands([])};
$('#iPur').onclick=e=>{if(e.target.dataset.x!==undefined){tmp.splice(+e.target.dataset.x,1);drawPur()}};
$('#addPur').onclick=()=>{const m=Math.max(0,...tmp.map(p=>+p.to||+p.from||0));tmp.push({app:tmp.at(-1)?.app||'',from:m+1,to:''});drawPur()};
$('#iTitle').oninput=e=>{const t=e.target.value;if(/^[ぁ-ヿー\s・ー]+$/.test(t)&&!editing)$('#iYomi').value=hira(t);if(!cover)drawCover()};
$('#cancel').onclick=closeEd;
$('#ov').onclick=e=>{if(e.target.id==='ov')closeEd()};
$('#form').onsubmit=e=>{
  e.preventDefault();const prev=before();
  const pur=tmp.filter(p=>+p.from>0).map(p=>({app:(p.app||'').trim(),from:+p.from,to:Math.max(+p.to||+p.from,+p.from)}));
  const d={title:$('#iTitle').value.trim(),yomi:$('#iYomi').value.trim(),author:$('#iAuthor').value.trim(),status:$('#iStatus').value,
    latest:+$('#iLatest').value||'',memo:$('#iMemo').value.trim(),rating:rate,cover,purchases:pur,updated:Date.now()};
  if(!d.title)return;
  if(editing)Object.assign(editing,d);else books.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d});
  closeEd();commit(prev,editing?'保存しました':`「${d.title}」を追加しました`);
};
$('#del').onclick=()=>{
  if(!delArmed){delArmed=true;$('#del').textContent='本当に削除';return}
  const prev=before();books=books.filter(b=>b!==editing);closeEd();commit(prev,`「${editing.title}」を削除しました`);
};

// list events
$('#list').onclick=e=>{const p=e.target.closest('[data-plus]');if(p){e.stopPropagation();plusOne(p.dataset.plus);return}const c=e.target.closest('.card');if(c)openEd(c.dataset.id)};
$('#list').onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))openEd(e.target.dataset.id)};
$('#idx').onclick=e=>{const g=e.target.dataset.g;if(g)document.getElementById('g-'+g)?.scrollIntoView({behavior:'smooth'})};
['#q','#fApp','#fFlag','#sort'].forEach(s=>$(s).addEventListener('input',render));
$('#add').onclick=()=>openEd(null);
try{const s=localStorage.getItem(K+'-sort');if(s)$('#sort').value=s}catch(e){}
$('#sort').addEventListener('change',()=>{try{localStorage.setItem(K+'-sort',$('#sort').value)}catch(e){}});

// backup
const json=()=>JSON.stringify(books,null,1);
$('#bk').onclick=()=>{$('#bTxt').value=json();$('#ovB').classList.add('on')};
$('#bClose').onclick=()=>$('#ovB').classList.remove('on');
$('#ovB').onclick=e=>{if(e.target.id==='ovB')$('#ovB').classList.remove('on')};
$('#bCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#bTxt').value);toast('コピーしました')}catch(e){$('#bTxt').select();toast('選択しました。長押しでコピーしてください')}};
$('#bDl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json()],{type:'application/json'}));a.download='manga-shelf-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();toast('保存しました')}catch(e){toast('この画面では保存できません。コピーを使ってください')}};
$('#bFile').onchange=async e=>{const f=e.target.files[0];if(f)$('#bTxt').value=await f.text();e.target.value=''};
$('#bAuto').onclick=async()=>{
  if(blocked()){toast(NOTE);return}
  const todo=books.filter(b=>!okCover(b.cover));if(!todo.length){toast('すべての作品に表紙があります');return}
  const btn=$('#bAuto');btn.disabled=true;let ok=0;
  for(const[i,b]of todo.entries()){btn.textContent=`取得中… ${i+1}/${todo.length}`;
    try{const l=await findCovers(b.title);if(l.length){b.cover=l[0].url;ok++}}catch(e){}
    await new Promise(r=>setTimeout(r,400))}
  btn.disabled=false;btn.textContent='表紙のない作品の表紙をまとめて取得';save();render();
  toast(`${ok}作品の表紙を取得しました（違うものはカードを開いて選び直せます）`);
};
$('#bLoad').onclick=()=>{
  try{const d=JSON.parse($('#bTxt').value);if(!Array.isArray(d))throw 0;const prev=before();
    books=d.filter(b=>b&&b.title).map((b,i)=>({id:String(b.id||'m'+i+Date.now()),title:String(b.title),yomi:String(b.yomi||''),author:String(b.author||''),status:b.status==='完結'?'完結':'連載中',
      latest:+b.latest||'',rating:Math.min(5,Math.max(0,+b.rating||0)),memo:String(b.memo||''),cover:okCover(b.cover)?b.cover:'',updated:+b.updated||Date.now(),
      purchases:(Array.isArray(b.purchases)?b.purchases:[]).map(p=>({app:String(p.app||''),from:+p.from||1,to:+p.to||+p.from||1}))}));
    $('#ovB').classList.remove('on');commit(prev,`${books.length}作品を読み込みました`)}
  catch(e){toast('読み込めませんでした。内容を確認してください')}
};
try{if(window.self!==window.top)$('#bDl').style.display='none'}catch(e){$('#bDl').style.display='none'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEd();$('#ovB').classList.remove('on')}});
render();
}
</script>
</body>
